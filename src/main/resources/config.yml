config-version: '1.0'
# Do not change this unless you really know what you're doing!

override-enchanting-table: true
# Replace the vanilla enchanting table with the custom enchanting gui.

play-sound-on-enchant: true
# Whether or not to play a sound effect when the player enchants an item

check-for-updates: true
# Checks Modrinth on startup and logs a message if a newer release is available.

replace-enchant-command: true
# Replaces /enchant (vanilla's, or another plugin's) with Nouveau Enchanting's version, which can add custom enchants
# and lets addons react to the enchanting. It uses the same syntax as vanilla: /enchant <targets> <enchantment> [level]
# Uses the nouveauenchanting.commands.enchant permission. Requires a restart to change.

generate-datapack: true
# Nouveau Enchanting generates a datapack (plugins/NouveauEnchanting/generated-datapack) on every start. It holds the
# custom enchants from addons and the enchants whose effects are changed in enchants.yml.
# If the server ever fails to start with an error that mentions the pack "NouveauEnchanting/generated", set this to
# false to start without it. Effects from enchants.yml and addons aren't used while it's off. Requires a restart.

gui-info:
  fill-inventory: true
  # Whether or not to fill the empty slots of the enchanting gui with the filler item
  fill-inventory-material:
    material: BLACK_STAINED_GLASS_PANE
  # Item used to fill the gui. Custom items are supported, e.g.
  #    material: blank_item
  #    custom-material:
  #      source: "itemsadder"
  #      namespace: "mynamespace"

  inventory-name: 'Enchanting Table'
  # Can use FontImages for custom GUI
  tool-slot: 10
  # Inventory slot for the tool being enchanted
  material-slot: 12
  # Inventory slot for the material you're enchanting with
  cost-preview-slot: 14
  # Inventory slot for the arrow icon that shows the cost
  result-slot: 16
  # Inventory slot that the resulting enchanted item shows up on
  cost-preview-item:
    material: ENCHANTED_BOOK

# Itemsadder arrow example:
#    material: icon_right_blue
