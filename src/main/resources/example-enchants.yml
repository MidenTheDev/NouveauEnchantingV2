# Custom enchants can be made without any code by writing them in a .yml file in this folder.
# Every .yml file in this folder is read, so you can have as many files as you like. Changes need a restart.
#
# Each enchant uses the same settings as enchants.yml (see bane_of_arthropods there for what each one does).
# Only allowed-items is required. What the enchant does is set with effects.
#
# The enchant's full name is <file name>:<enchant name>, e.g. frost_blade in this file is example-enchants:frost_blade.
# To choose the first part yourself, write the full name instead, e.g. "myserver:frost_blade":
# Use the full name in materials.yml to make the enchant available in the enchanting gui, and in /ne enchant.
#
# Remove the # from the lines below to try the example enchants.

