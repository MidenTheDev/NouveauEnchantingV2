# Every setting is optional. Leave one out (or delete the line) to keep the enchant's vanilla or datapack value.
# See bane_of_arthropods below for an example of every setting.
#
# Custom enchants from Nouveau Enchanting and its addons use the same settings, under their full key
# (e.g. nouveauenchanting:ice_aspect). Their default settings are added to the end of this file the first time they load.
#
# allowed-items and primary-items can list items (e.g. "mace") and item tags starting with # (e.g. "#swords").
# Any vanilla or datapack item tag works, see https://minecraft.wiki/w/Item_tag_(Java_Edition)
# Items, enchants and tags without a namespace default to minecraft.

aqua_affinity:
  max-level: 1
  allowed-items:
    - "#head_armor"

# Bane of Arthropods lists every available setting as an example, set to the vanilla values.
bane_of_arthropods:
  # Highest level the enchant can reach, from 1 to 255.
  max-level: 5

  # Name of the enchant shown on items, in MiniMessage format. The level (e.g. "V") is added after it automatically.
  # Leave it out to keep the vanilla name, which is translated into each player's language.
  # Plain text works, e.g. "<gray>Bane of Arthropods", but <lang:key> shows a translation in each player's language.
  # Custom translation keys need a resource pack that adds them. Use <lang_or:key:'Fallback text'> to show
  # the fallback text to players who don't have the translation, e.g. "<lang_or:myserver.enchant.bane:'Bane of Arthropods'>"
  description: "<lang:enchantment.minecraft.bane_of_arthropods>"

  # Items the enchant can be put on, through this plugin's enchanting gui, anvils and commands.
  allowed-items:
    - "#swords"
    - "#axes"
    - "#spears"
    - "mace"

  # Items the enchant can show up on from the vanilla enchanting table and random enchanting (loot, mob gear, etc).
  # Should only contain items that are also in allowed-items. Enchants without primary-items use allowed-items instead.
  primary-items:
    - "#swords"

  # Enchants this one can't be on the same item with. Enchant tags work too, e.g. "#exclusive_set/damage".
  # Conflicts work both ways, so an enchant listed here also can't be added to items that already have this one.
  conflicts-with:
    - "sharpness"
    - "smite"
    - "impaling"
    - "breach"
    - "density"

  # Enchantment tags to add the enchant to. These decide where it can be found, for example:
  #   in_enchanting_table - offered by the vanilla enchanting table (primary-items only matters if it's in this tag)
  #   on_random_loot      - found on loot in chests, fishing, etc.
  #   tradeable           - sold by librarian villagers
  #   treasure            - can't be found in enchanting tables, only in loot and trades (e.g. Mending)
  # For vanilla enchants this only adds to the tags they're already in. Custom enchants are in no tags unless they set some.
  # See https://minecraft.wiki/w/Enchantment_tag_(Java_Edition) for every tag.
  #tags:
  #  - "in_enchanting_table"
  #  - "on_random_loot"
  #  - "tradeable"

  # How expensive the enchant is to combine in an anvil. The anvil multiplies this by the level, and halves it for books.
  anvil-cost: 2

  # How likely the enchant is to be picked in random enchanting, from 1 to 1024. Higher is more common.
  # Vanilla uses 10 for common, 5 for uncommon, 2 for rare and 1 for very rare enchants.
  weight: 5

  # The range of enchanting levels each level of the enchant can be picked at in random enchanting.
  # A level's cost is: base + per-level * (level - 1). With these values, level I is 5-25, level II is 13-33, and so on.
  # You can set just base or just per-level, the other keeps its default.
  min-cost:
    base: 5
    per-level: 8
  max-cost:
    base: 25
    per-level: 8

  # Equipment slots the item has to be in for the enchant to have an effect.
  # Options: any, mainhand, offhand, hand, head, chest, legs, feet, armor, body, saddle
  active-slots:
    - mainhand

